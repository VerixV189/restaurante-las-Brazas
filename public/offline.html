<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modo Sin Conexión — Restaurante Las Brazas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 18px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ffffff;
    }
    p {
      font-size: 13.5px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 22px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button, a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn-primary {
      background: linear-gradient(90deg, #ea580c, #f59e0b);
      color: #ffffff;
    }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    button:hover, a:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      Modo Offline Activo
    </div>
    <h1>Sin conexión a internet</h1>
    <p>
      Esta sección no estaba guardada en la memoria local o tu sesión anterior fue cerrada por seguridad.
      Puedes volver a las páginas ya visitadas o reintentar cuando se restablezca la red.
    </p>
    <div class="actions">
      <button class="btn-primary" onclick="window.location.reload()">Reintentar conexión</button>
      <button class="btn-secondary" onclick="window.history.back()">Volver a la pantalla anterior</button>
      <a class="btn-secondary" href="/">Ir al Inicio Público</a>
    </div>
  </div>
</body>
</html>
